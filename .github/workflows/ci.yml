name: Build, publish, and deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: animal-face-test
  CONTAINER_NAME: animal-face-test
  APP_PORT: '8765'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set image name
        id: image
        shell: bash
        run: echo "image=${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-self-hosted:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull and replace local container
        shell: pwsh
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker pull $env:IMAGE
          docker rm -f $env:CONTAINER_NAME 2>$null
          docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p "${env:APP_PORT}:8765" $env:IMAGE
          $healthy = $false
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:$env:APP_PORT/api/status" -TimeoutSec 5
              if ($response.model_ready -eq $true) { $healthy = $true; break }
            } catch { Write-Host "Health check $i/30 failed: $($_.Exception.Message)" }
          }
          if (-not $healthy) { docker logs $env:CONTAINER_NAME; throw 'Container health check failed.' }
          Write-Host "Deployed $env:IMAGE successfully."
