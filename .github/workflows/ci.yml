name: Build, publish, and deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: animal-face-test
  CONTAINER_NAME: animal-face-test
  APP_PORT: '8765'

jobs:
  evaluate-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install evaluation dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare pinned model without committing it
        run: |
          mkdir -p models
          curl -fsSL 'https://github.com/onnx/models/raw/main/validated/vision/classification/mobilenet/model/mobilenetv2-7.onnx' -o models/mobilenetv2-7.onnx
          echo 'C1C513582D56AFCEFF8516C73804E484C81C6A830712AB6D682253F4A3CD042F  models/mobilenetv2-7.onnx' | sha256sum -c -
      - name: Evaluate fixed 30/70 public split
        run: python mlops/evaluate.py | tee evaluation.json
      - name: Upload evaluation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation
          path: evaluation.json

  build-and-push:
    needs: evaluate-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-self-hosted:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull and replace local container
        shell: powershell
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:IMAGE)) {
            throw 'IMAGE is empty. Check the DOCKERHUB_USERNAME GitHub Secret.'
          }
          $containerName = $env:CONTAINER_NAME
          $port = [int]$env:APP_PORT

          $logDir = Join-Path $env:GITHUB_WORKSPACE 'deployment-logs'
          New-Item -ItemType Directory -Force $logDir | Out-Null
          $monitorLog = Join-Path $logDir 'monitor.jsonl'
          $fixedImage = Join-Path $logDir 'fixed-test.jpg'
          $metaUrl = 'https://datasets-server.huggingface.co/first-rows?dataset=Pratheesh99%2Fanimal-faces-raw&config=default&split=val&offset=0&length=1'
          $meta = (Invoke-WebRequest $metaUrl -UseBasicParsing).Content | ConvertFrom-Json
          Invoke-WebRequest $meta.rows[0].row.image.src -OutFile $fixedImage -UseBasicParsing
          if (-not (Test-Path $fixedImage)) { throw 'Fixed monitoring image could not be prepared.' }
          $monitor = Start-Process powershell.exe -PassThru -WindowStyle Hidden -WorkingDirectory $env:GITHUB_WORKSPACE -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE\mlops\monitor.ps1",'-DurationSeconds','90','-LogPath',$monitorLog,'-TestImagePath',$fixedImage)
          $monitor.Id | Out-File (Join-Path $logDir 'monitor.pid') -Encoding ascii
          Start-Sleep -Seconds 5
          if ($monitor.HasExited) { throw 'Independent monitor exited before deployment.' }

          Write-Host "Pulling image: $env:IMAGE"
          docker pull $env:IMAGE
          if ($LASTEXITCODE -ne 0) { throw "docker pull failed for $env:IMAGE" }

          # Remove only the previous deployment. A missing container is expected.
          docker rm -f $containerName 2>$null | Out-Null
          $runOutput = docker run -d --name $containerName --restart unless-stopped -p "127.0.0.1:${port}:8765" $env:IMAGE 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "docker run output: $runOutput"
            docker ps -a
            throw 'docker run failed; the new container was not created.'
          }
          $containerId = ($runOutput | Select-Object -Last 1).ToString().Trim()
          Write-Host "Started container: $containerId"

          $healthy = $false
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 2
            $state = docker inspect --format '{{.State.Status}}' $containerName 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Health check $i/30: container does not exist."
              continue
            }
            Write-Host "Health check $i/30: container state=$state"
            try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/status" -TimeoutSec 5
              if ($response.model_ready -eq $true) { $healthy = $true; break }
            } catch { Write-Host "Health check $i/30 failed: $($_.Exception.Message)" }
          }
          if (-not $healthy) {
            Write-Host 'Final container list:'
            docker ps -a
            $exists = docker container inspect $containerName 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Container logs:'
              docker logs $containerName
            } else {
              Write-Host "Container '$containerName' does not exist after docker run."
            }
            throw 'Container health check failed.'
          }
          Write-Host "Deployed $env:IMAGE successfully."
          Start-Sleep -Seconds 30
          if (Get-Process -Id $monitor.Id -ErrorAction SilentlyContinue) { Stop-Process -Id $monitor.Id -Force }

      - name: Publish monitoring logs and summary
        if: always()
        shell: powershell
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'deployment-logs/monitor.jsonl'
          $pidFile = Join-Path $env:GITHUB_WORKSPACE 'deployment-logs/monitor.pid'
          if (Test-Path $pidFile) { $monitorPid = Get-Content $pidFile; Stop-Process -Id $monitorPid -Force -ErrorAction SilentlyContinue }
          if (Test-Path $log) {
            $rows = @(Get-Content $log | ForEach-Object { $_ | ConvertFrom-Json })
            $success = @($rows | Where-Object analysis_ok).Count
            $failure = $rows.Count - $success
            $gaps = @()
            for ($i = 1; $i -lt $rows.Count; $i++) { $gaps += (([datetime]$rows[$i].start - [datetime]$rows[$i-1].start).TotalSeconds) }
            $maxGap = if ($gaps.Count) { ($gaps | Measure-Object -Maximum).Maximum } else { 0 }
            $representative = @($rows[0], $rows[[math]::Floor($rows.Count / 2)], $rows[$rows.Count - 1]) | ForEach-Object { "| $($_.start) | $($_.version) | $($_.status) | $($_.latency_ms) ms | $($_.analysis_ok) |" }
            $summary = @("# Zero-Downtime Deployment Verification", "", "| Item | Value |", "|---|---|", "| Address | http://127.0.0.1:8765 |", "| Observed UTC | $($rows[0].start) to $($rows[-1].end) |", "| Requests | $($rows.Count) |", "| Success / Failure | $success / $failure |", "| Target interval | 1 second |", "| Maximum recorded gap | $([math]::Round([double]$maxGap,2)) seconds |", "| Dataset | Pratheesh99/animal-faces-raw val, 100 rows (30 tune / 70 final) |", "| Zero-downtime statement | No failed API response was observed in this monitor range; unobserved gaps remain unverified. |", "", "## Representative responses", "", "| Time (UTC) | Version | HTTP | Latency | Analysis OK |", "|---|---|---:|---:|---|") + $representative
            $summary | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
            Get-Content $log
          }
          else { '# Monitoring log unavailable' | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 }
      - name: Upload monitoring logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-monitoring
          path: deployment-logs
